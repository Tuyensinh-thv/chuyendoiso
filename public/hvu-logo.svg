<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for text along curved paths -->
  <defs>
    <!-- Path for Vietnamese University name (top-left arc) -->
    <path id="path-vn-text" d="M 28 100 A 72 72 0 0 1 93 28" fill="none" />
    <!-- Path for English University name (top-right arc) -->
    <path id="path-en-text" d="M 107 28 A 72 72 0 0 1 172 100" fill="none" />
    <!-- Path for bottom text 2003 -->
    <path id="path-year-text" d="M 60 156 A 72 72 0 0 0 140 156" fill="none" />
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#d81a21" stroke-width="2.5" />
  <circle cx="100" cy="100" r="93" fill="none" stroke="#d81a21" stroke-width="0.8" />

  <!-- Top Center Flower / Atom Symbol in Red -->
  <g transform="translate(100, 19)" fill="#d81a21" stroke="#d81a21">
    <ellipse cx="0" cy="0" rx="4.2" ry="1.8" fill="none" stroke-width="0.9" />
    <ellipse cx="0" cy="0" rx="4.2" ry="1.8" transform="rotate(60)" fill="none" stroke-width="0.9" />
    <ellipse cx="0" cy="0" rx="4.2" ry="1.8" transform="rotate(120)" fill="none" stroke-width="0.9" />
    <circle cx="0" cy="0" r="1.3" fill="#d81a21" />
  </g>

  <!-- Curved Texts around the border -->
  <!-- Vietnamese text: TRƯỜNG ĐẠI HỌC HÙNG VƯƠNG -->
  <text fill="#002d62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="800" letter-spacing="0.5">
    <textPath href="#path-vn-text" startOffset="50%" text-anchor="middle">
      TRƯỜNG ĐẠI HỌC HÙNG VƯƠNG
    </textPath>
  </text>

  <!-- English text: HUNG VUONG UNIVERSITY -->
  <text fill="#002d62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8">
    <textPath href="#path-en-text" startOffset="50%" text-anchor="middle">
      HUNG VUONG UNIVERSITY
    </textPath>
  </text>

  <!-- Bottom text: 2003 -->
  <text fill="#d81a21" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="1">
    <textPath href="#path-year-text" startOffset="50%" text-anchor="middle">
      2003
    </textPath>
  </text>

  <!-- Inner circle boundary -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#d81a21" stroke-width="1.8" />

  <!-- Center Emblem in Red (#d81a21) -->
  <g fill="#d81a21">
    <!-- Traditional Temple Pagoda Roof (Đền Hùng) -->
    <!-- Top small ridge -->
    <path d="M 94 48 L 100 42 L 106 48 Z" />
    <!-- Upper roof layer with curved eaves -->
    <path d="M 68 60 C 78 55 90 53 100 53 C 110 53 122 55 132 60 C 122 62 110 61 100 61 C 90 61 78 62 68 60 Z" />
    <!-- Middle connector block -->
    <rect x="85" y="61" width="30" height="7" rx="0.5" />
    <!-- Lower wide roof layer with curved swept-up eaves -->
    <path d="M 52 74 C 68 67 84 66 100 66 C 116 66 132 67 148 74 C 136 76 118 75 100 75 C 82 75 64 76 52 74 Z" />
    <rect x="88" y="75" width="24" height="6" />

    <!-- Monogram H & V with dynamic curved wings -->
    <!-- Left vertical leg of H -->
    <rect x="61" y="86" width="16" height="52" rx="1.5" />
    <!-- Right vertical leg of H -->
    <rect x="123" y="86" width="16" height="52" rx="1.5" />

    <!-- Center stylized V and outward curving aerodynamic ribbons/wings -->
    <!-- Ribbon 1 (Top curve) -->
    <path d="M 26 95 C 48 93 68 108 100 134 C 132 108 152 93 174 95 C 160 106 134 122 100 148 C 66 122 40 106 26 95 Z" />
    <!-- Ribbon 2 (Middle curve) -->
    <path d="M 28 105 C 50 104 68 116 100 142 C 132 116 150 104 172 105 C 158 114 132 130 100 156 C 68 130 42 114 28 105 Z" />
    <!-- Ribbon 3 (Bottom solid chevron V connecting H) -->
    <path d="M 61 114 L 77 114 L 100 142 L 123 114 L 139 114 L 100 162 Z" />
  </g>
</svg>
